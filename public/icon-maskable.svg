<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Soft modern off-white/light blue studio canvas) -->
    <radialGradient id="studioGlowMask" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>

    <!-- Blue Cover 3D Gradients -->
    <linearGradient id="coverSurfaceM" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="coverSideDepthM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="coverBottomLipM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </linearGradient>

    <!-- White Paper Gradients -->
    <linearGradient id="paperSurfaceM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF2F6"/>
    </linearGradient>

    <!-- Spiral Ring 3D Gradients -->
    <linearGradient id="spiralRingGradM" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#0369A1"/>
      <stop offset="25%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#E0F2FE"/>
      <stop offset="75%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Pencil 3D Gradients -->
    <linearGradient id="pencilEraserM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="60%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>

    <linearGradient id="pencilFerruleM" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Pencil Body Facets -->
    <linearGradient id="pencilFacetTopM" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="pencilFacetMidM" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="pencilFacetBotM" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>

    <!-- Pencil Sharpened Wood -->
    <linearGradient id="pencilWoodM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>

    <!-- Filters for Realistic 3D Soft Shadows -->
    <filter id="bookDropShadowM" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="8" dy="24" stdDeviation="20" flood-color="#0369A1" flood-opacity="0.25"/>
      <feDropShadow dx="2" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>

    <filter id="pencilShadowM" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="-6" dy="12" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>

    <filter id="spiralShadowM" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#0369A1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Full-bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#studioGlowMask)"/>

  <!-- Scaled group inside safe zone -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- 1. Notebook Outer Group with Drop Shadow -->
    <g filter="url(#bookDropShadowM)">

      <!-- Blue Cover 3D Backing / Thickness -->
      <rect x="94" y="80" width="298" height="348" rx="34" fill="url(#coverBottomLipM)"/>
      <rect x="90" y="74" width="298" height="348" rx="34" fill="url(#coverSideDepthM)"/>
      <!-- Blue Cover Surface -->
      <rect x="86" y="68" width="296" height="346" rx="32" fill="url(#coverSurfaceM)"/>

      <!-- Inner Paper Shadow on Cover -->
      <rect x="136" y="82" width="232" height="316" rx="22" fill="#0369A1" opacity="0.3"/>

      <!-- Thick White Notepad Stack -->
      <rect x="134" y="80" width="232" height="316" rx="20" fill="#E2E8F0"/>
      <rect x="132" y="78" width="232" height="316" rx="20" fill="#F1F5F9"/>
      <!-- Topmost White Paper Sheet -->
      <rect x="130" y="76" width="232" height="316" rx="18" fill="url(#paperSurfaceM)"/>

      <!-- Ruled Horizontal Writing Lines -->
      <g stroke="#BAE6FD" stroke-width="4.5" stroke-linecap="round" opacity="0.85">
        <line x1="172" y1="136" x2="336" y2="136"/>
        <line x1="172" y1="178" x2="336" y2="178"/>
        <line x1="172" y1="220" x2="336" y2="220"/>
        <line x1="172" y1="262" x2="336" y2="262"/>
        <line x1="172" y1="304" x2="336" y2="304"/>
        <line x1="172" y1="346" x2="336" y2="346"/>
      </g>
    </g>

    <!-- 2. Spiral Binder Rings (Left Spine) -->
    <g fill="#075985" opacity="0.6">
      <ellipse cx="146" cy="116" rx="6" ry="6"/>
      <ellipse cx="146" cy="166" rx="6" ry="6"/>
      <ellipse cx="146" cy="216" rx="6" ry="6"/>
      <ellipse cx="146" cy="266" rx="6" ry="6"/>
      <ellipse cx="146" cy="316" rx="6" ry="6"/>
      <ellipse cx="146" cy="366" rx="6" ry="6"/>
    </g>

    <!-- 3D Spiral Rings -->
    <g filter="url(#spiralShadowM)">
      <g transform="translate(0, 0)">
        <path d="M 100 128 C 76 122, 74 102, 98 94 C 122 86, 150 94, 150 114 C 150 126, 142 128, 140 120 C 136 106, 116 100, 102 106 C 90 110, 88 118, 104 122 Z" fill="url(#spiralRingGradM)"/>
      </g>
      <g transform="translate(0, 50)">
        <path d="M 100 128 C 76 122, 74 102, 98 94 C 122 86, 150 94, 150 114 C 150 126, 142 128, 140 120 C 136 106, 116 100, 102 106 C 90 110, 88 118, 104 122 Z" fill="url(#spiralRingGradM)"/>
      </g>
      <g transform="translate(0, 100)">
        <path d="M 100 128 C 76 122, 74 102, 98 94 C 122 86, 150 94, 150 114 C 150 126, 142 128, 140 120 C 136 106, 116 100, 102 106 C 90 110, 88 118, 104 122 Z" fill="url(#spiralRingGradM)"/>
      </g>
      <g transform="translate(0, 150)">
        <path d="M 100 128 C 76 122, 74 102, 98 94 C 122 86, 150 94, 150 114 C 150 126, 142 128, 140 120 C 136 106, 116 100, 102 106 C 90 110, 88 118, 104 122 Z" fill="url(#spiralRingGradM)"/>
      </g>
      <g transform="translate(0, 200)">
        <path d="M 100 128 C 76 122, 74 102, 98 94 C 122 86, 150 94, 150 114 C 150 126, 142 128, 140 120 C 136 106, 116 100, 102 106 C 90 110, 88 118, 104 122 Z" fill="url(#spiralRingGradM)"/>
      </g>
      <g transform="translate(0, 250)">
        <path d="M 100 128 C 76 122, 74 102, 98 94 C 122 86, 150 94, 150 114 C 150 126, 142 128, 140 120 C 136 106, 116 100, 102 106 C 90 110, 88 118, 104 122 Z" fill="url(#spiralRingGradM)"/>
      </g>
    </g>

    <!-- 3. Classic 3D Wooden Pencil -->
    <g filter="url(#pencilShadowM)" transform="translate(332, 238) rotate(-38)">
      <!-- Pink Eraser -->
      <path d="M -17 -168 C -17 -184, 17 -184, 17 -168 L 17 -144 L -17 -144 Z" fill="url(#pencilEraserM)"/>
      <path d="M -9 -178 C -4 -182, 4 -182, 9 -178 L 9 -144 L -9 -144 Z" fill="#FBCFE8" opacity="0.45"/>

      <!-- Ferrule -->
      <rect x="-18" y="-144" width="36" height="34" rx="3" fill="url(#pencilFerruleM)"/>
      <line x1="-18" y1="-134" x2="18" y2="-134" stroke="#475569" stroke-width="2" opacity="0.6"/>
      <line x1="-18" y1="-122" x2="18" y2="-122" stroke="#475569" stroke-width="2" opacity="0.6"/>
      <line x1="-18" y1="-132" x2="18" y2="-132" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>

      <!-- Pencil Body (3 Facets) -->
      <polygon points="-18,-110 -6,-110 -6,108 -18,108" fill="url(#pencilFacetTopM)"/>
      <polygon points="-6,-110 6,-110 6,108 -6,108" fill="url(#pencilFacetMidM)"/>
      <polygon points="6,-110 18,-110 18,108 6,108" fill="url(#pencilFacetBotM)"/>

      <line x1="-6" y1="-110" x2="-6" y2="108" stroke="#FEF08A" stroke-width="1.5" opacity="0.6"/>
      <line x1="6" y1="-110" x2="6" y2="108" stroke="#854D0E" stroke-width="1.5" opacity="0.5"/>

      <!-- Sharpened Cone -->
      <path d="M -18 108 Q -12 114 -6 108 Q 0 114 6 108 Q 12 114 18 108 L 0 166 Z" fill="url(#pencilWoodM)"/>
      <path d="M 6 108 Q 12 114 18 108 L 0 166 L 3 138 Z" fill="#F59E0B" opacity="0.35"/>

      <!-- Black Graphite Tip Point -->
      <polygon points="-7,144 7,144 0,168" fill="#0F172A"/>
      <circle cx="-1" cy="154" r="1.5" fill="#94A3B8"/>
    </g>
  </g>
</svg>
