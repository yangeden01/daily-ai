name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release (Direct .apk download without zip)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web application
        run: pnpm build

      - name: Sync Capacitor Android
        run: pnpm exec cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/Daily-AI.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daily-AI-APK
          path: release-output/Daily-AI.apk
          if-no-files-found: error

      - name: Publish Direct APK to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: Daily AI Android APK (v1.0.0)
          body: |
            ### 📱 Daily AI Android APK 安裝檔
            
            - **檔案名稱**：`Daily-AI.apk`
            - **下載方式**：直接點擊下方的 `Daily-AI.apk` 即可在手機下載安裝，無需解壓縮！
            - **更新時間**：${{ github.event.head_commit.timestamp || '最新建置' }}
          files: release-output/Daily-AI.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
