<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // 在預覽（iframe）或本機開發環境下，主動清除舊 Service Worker，防止攔截或快取導致白畫面
      try {
        if (window.self !== window.top || location.hostname === 'localhost' || location.hostname.includes('ais-dev-') || location.hostname.includes('run.app')) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EdenNote" />
    <meta name="application-name" content="EdenNote" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>EdenNote</title>
    <meta name="description" content="EdenNote - 記錄、搜尋與整理每日事件與筆記的本機優先個人日誌與手機記事本。" />
    <meta property="og:title" content="EdenNote" />
    <meta property="og:description" content="EdenNote - 記錄、搜尋與整理每日事件與筆記的本機優先個人日誌與手機記事本。" />
  </head>
  <body>
    <div id="root">
      <div id="initial-loading-fallback" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #fafaf9; color: #292524; padding: 24px; text-align: center;">
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
          .loading-spinner { width: 36px; height: 36px; border: 3px solid #e7e5e4; border-top-color: #4f46e5; border-radius: 50%; animation: spin 0.8s linear infinite; }
        </style>
        <div class="loading-spinner"></div>
        <p style="margin-top: 16px; font-size: 15px; font-weight: 600; color: #1c1917;">EdenNote 載入中...</p>
        <p id="initial-loading-tip" style="margin-top: 6px; font-size: 13px; color: #78716c; max-width: 280px; line-height: 1.4;">正在同步應用程式資源</p>
        <button type="button" onclick="location.reload(true)" style="margin-top: 16px; padding: 8px 16px; font-size: 13px; font-weight: 500; color: #4338ca; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
          <span>🔄 重新整理 (Reload)</span>
        </button>
      </div>
    </div>
    <script>
      setTimeout(function() {
        var tip = document.getElementById('initial-loading-tip');
        if (tip) {
          tip.innerHTML = '若載入較久，請點擊下方按鈕重新整理，或下拉螢幕更新畫面';
        }
      }, 3000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
